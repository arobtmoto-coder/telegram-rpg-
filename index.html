<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map() vs forEach() Demo</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      padding: 30px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #007bff;
    }
    code {
      background: #eef1f6;
      padding: 3px 6px;
      border-radius: 4px;
      color: #d63384;
    }
    .output {
      font-weight: bold;
      color: #28a745;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>JavaScript Array Methods</h1>
    
    <p>Original Array: <code>[10, 20, 30, 40]</code></p>

    <!-- map() Output Card -->
    <div class="card">
      <h2>1. map() Demo</h2>
      <p>Naya transformed array return karta hai:</p>
      <div class="output" id="map-output"></div>
    </div>

    <!-- forEach() Output Card -->
    <div class="card">
      <h2>2. forEach() Demo</h2>
      <p>Har element par loop chalakar action perform karta hai:</p>
      <div class="output" id="foreach-output"></div>
    </div>
  </div>

  <script>
    const numbers = [10, 20, 30, 40];

    // 1. map() Example: Returns a new array with doubled values
    const doubledArray = numbers.map(num => num * 2);
    document.getElementById('map-output').innerText = `New Array: [${doubledArray.join(', ')}]`;

    // 2. forEach() Example: Iterates and performs side effects (DOM manipulation)
    const foreachDiv = document.getElementById('foreach-output');
    numbers.forEach((num, index) => {
      foreachDiv.innerHTML += `Index ${index}: ${num} x 2 = ${num * 2}<br>`;
    });
  </script>

</body>
</html>
