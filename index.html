<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Element RPG</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#14232b;
}

#game{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    touch-action:none;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    right:15px;

    background:rgba(10,15,20,.92);
    border-radius:18px;
    padding:15px;

    color:white;
    z-index:10;
}

.top{
    display:flex;
    justify-content:space-between;
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.barTitle{
    font-size:14px;
    margin:5px 0;
}

.bar{
    width:100%;
    height:15px;
    background:#30343a;
    border-radius:10px;
    overflow:hidden;
}

#hpBar{
    height:100%;
    width:100%;
    background:#ef4444;
}

#xpBar{
    height:100%;
    width:0%;
    background:#facc15;
}

#skillButton{
    position:fixed;
    right:20px;
    bottom:25px;

    border:0;
    border-radius:20px;

    padding:17px 25px;

    background:#7c3aed;
    color:white;

    font-size:17px;
    font-weight:bold;

    z-index:20;
}

#useSkill{
    position:fixed;
    left:20px;
    bottom:25px;

    border:0;
    border-radius:20px;

    padding:17px 25px;

    background:#334155;
    color:white;

    font-size:16px;
    font-weight:bold;

    z-index:20;
}

#skillPanel{
    display:none;

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:90%;
    max-width:420px;

    max-height:80vh;

    overflow-y:auto;

    background:#111827;

    border:2px solid #475569;

    border-radius:22px;

    padding:20px;

    z-index:50;

    color:white;

    box-shadow:0 20px 60px rgba(0,0,0,.7);
}

#skillPanel h2{
    margin-top:0;
    text-align:center;
}

.skill{
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin:8px 0;

    padding:15px;

    border:0;
    border-radius:15px;

    background:#263244;

    color:white;

    font-size:15px;
    font-weight:bold;

    text-align:left;
}

.skill span{
    font-size:12px;
    opacity:.8;
}

.skill.locked{
    opacity:.45;
}

#closeSkill{
    width:100%;

    margin-top:12px;

    padding:13px;

    border:0;
    border-radius:12px;

    background:#374151;

    color:white;

    font-weight:bold;
}

#message{
    position:fixed;

    left:50%;
    top:30%;

    transform:translateX(-50%);

    padding:12px 20px;

    background:rgba(0,0,0,.8);

    color:white;

    border-radius:15px;

    font-weight:bold;

    opacity:0;

    transition:.2s;

    z-index:100;

    pointer-events:none;
}



/* ===== CARD-BASED SKILL SYSTEM ===== */
#activeSkillBadge{position:fixed;left:18px;bottom:18px;z-index:20;padding:11px 14px;border-radius:16px;background:rgba(17,24,39,.9);border:2px solid rgba(250,204,21,.7);color:#fff;font-size:12px;font-weight:900;box-shadow:0 8px 25px rgba(0,0,0,.35);pointer-events:none}
#skillButton{right:18px;bottom:18px;padding:13px 16px;border-radius:16px;background:linear-gradient(#fff,#dbeafe);color:#182033;border:2px solid #7c8aa5;font-size:14px;font-weight:900;z-index:20}
#skillPanel{display:none;position:fixed;inset:0;z-index:80;width:100%;max-width:none;max-height:none;overflow:auto;transform:none;left:0;top:0;padding:75px 18px 30px;background:rgba(0,0,0,.94);border:0;border-radius:0}
#skillPanel h2{color:#fff;font-size:28px;text-align:center}
#ownedSkillsList{width:min(650px,96vw);margin:auto;display:grid;gap:12px}
.ownedRow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:16px;background:linear-gradient(#2b3342,#171d28);border:1px solid rgba(255,255,255,.12);color:#fff}
.ownedIcon{font-size:29px;width:40px;text-align:center}.ownedInfo{flex:1}.ownedName{font-size:16px;font-weight:900}.ownedDesc{font-size:12px;opacity:.75;margin-top:3px}.ownedRank{padding:6px 8px;border-radius:10px;background:#facc15;color:#3a2500;font-weight:900}
#closeSkill,#closeBook{display:block;width:min(650px,96vw);margin:20px auto 0;padding:14px;border:0;border-radius:15px;background:#374151;color:#fff;font-weight:900;font-size:15px}
#choiceOverlay,#bookOverlay{display:none;position:fixed;inset:0;z-index:120}
.choiceShade,.bookShade{position:absolute;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(3px)}
.choiceContent{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,97vw);max-height:94vh;overflow:auto;padding:16px 8px 20px;color:#fff;text-align:center}
.choiceTitle{font-size:28px;font-weight:1000;text-shadow:0 3px #000;margin-bottom:3px}.choiceSub{font-size:11px;font-weight:900;letter-spacing:2px;color:#facc15;margin-bottom:14px}
#choiceCards{display:flex;gap:9px;justify-content:center}
.skillCard{position:relative;flex:1;min-width:0;min-height:350px;border-radius:20px 20px 30px 30px;border:3px solid #f8cf49;background:linear-gradient(#ffd85a 0 29%,#eeb527 29% 49%,#3b251a 49%);color:#fff;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.35);cursor:pointer}
.skillCard.passive{border-color:#59c9ff;background:linear-gradient(#55c9f2 0 29%,#239ecb 29% 49%,#102c58 49%)}
.skillCard:active{transform:scale(.97)}
.cardRibbon{position:absolute;top:-2px;left:50%;transform:translateX(-50%);min-width:92px;padding:6px 10px;border-radius:0 0 16px 16px;background:#ffd43b;color:#855400;font-weight:1000;font-size:12px;box-shadow:0 3px #b78614}
.passive .cardRibbon{background:#56d5ff;color:#07517a;box-shadow:0 3px #1684b0}
.cardName{margin-top:43px;padding:0 4px;font-size:16px;font-weight:1000;text-shadow:0 2px rgba(0,0,0,.35)}
.cardIcon{height:100px;display:flex;align-items:center;justify-content:center;font-size:62px;filter:drop-shadow(0 7px 5px rgba(0,0,0,.35))}
.cardRankDots{font-size:11px;letter-spacing:2px}.cardBody{padding:12px 9px 18px;min-height:145px}.cardDesc{font-size:12px;line-height:1.3;font-weight:900}.cardMeta{margin-top:13px;font-size:10px;opacity:.8;font-weight:900}.cardEvolution{margin-top:7px;font-size:10px;color:#fef08a;font-weight:900}
.choiceFree{margin-top:13px;font-weight:1000;font-size:13px}
.bookContent{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);max-height:90vh;overflow:auto;text-align:center;color:#fff}.bookIcon{font-size:58px}.bookTitle{font-size:24px;font-weight:1000;margin:8px 0 16px}.recipe{display:flex;justify-content:center;gap:8px;padding:10px;border-bottom:1px solid rgba(255,255,255,.14);font-size:22px}.recipe span{font-size:12px;font-weight:900}
@media(max-width:430px){.choiceTitle{font-size:24px}.skillCard{min-height:325px;border-radius:17px 17px 25px 25px}.cardName{font-size:13px}.cardIcon{height:82px;font-size:50px}.cardBody{padding:9px 6px}.cardDesc{font-size:11px}.cardMeta,.cardEvolution{font-size:9px}}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div class="top">

        <div>
            ⭐ Lv <span id="level">1</span>
        </div>

        <div>
            🪙 <span id="coins">0</span>
        </div>

        <div>
            🏆 Stage <span id="stage">1</span>
        </div>

    </div>

    <div class="barTitle">
        ❤️ HP
    </div>

    <div class="bar">
        <div id="hpBar"></div>
    </div>

    <div class="barTitle">
        ✨ XP
    </div>

    <div class="bar">
        <div id="xpBar"></div>
    </div>

</div>

<div id="activeSkillBadge">⚡ ACTIVE: NONE</div>
<button id="skillButton">📖 SKILL BOOK</button>

<div id="skillPanel" aria-hidden="true">
<h2>⚡ SKILL BOOK</h2>
<div id="ownedSkillsList"></div>
<button id="closeSkill">CLOSE</button>
</div>

<div id="choiceOverlay" aria-hidden="true">
<div class="choiceShade"></div>
<div class="choiceContent">
<div class="choiceTitle">Choose your Skill!</div>
<div class="choiceSub" id="choiceSub">GOLDEN CARD • NEW SKILL</div>
<div id="choiceCards"></div>
<div class="choiceFree">FREE • Choose 1</div>
</div></div>

<div id="bookOverlay" aria-hidden="true">
<div class="bookShade"></div>
<div class="bookContent">
<div class="bookIcon">📖</div>
<div class="bookTitle">SKILL EVOLUTION BOOK</div>
<div id="bookList"></div>
<button id="closeBook">Tap to close</button>
</div></div>

<div id="message"></div>

<script>

"use strict";


/* =========================
   CANVAS
========================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W;
    canvas.height=H;

    if(player.x===0){

        player.x=W/2;
        player.y=H/2;
    }
}

window.addEventListener(
    "resize",
    resize
);


/* =========================
   PLAYER
========================= */

const player={

    x:0,
    y:0,

    speed:4,

    hp:100,
    maxHp:100,

    lastDamage:0,
    damageCooldown:700,
    dead:false,

    level:1,
    xp:0,

    coins:0,

    attack:15,

    lastAttack:0,

    facingX:1,
    facingY:0
};


/* =========================
   GAME DATA
========================= */

let stage=1;

let kills=0;

let monsters=[];

let projectiles=[];

let effects=[];

let particles=[];

let texts=[];

let selectedSkill=null;

let skillCooldowns={};
let ownedSkills={};
let passiveStats={crit:0,attack:0,maxHp:0,regen:0,haste:0};
let xpGems=[];
let pickupCard={active:true,x:0,y:0,pulse:0};
let choiceOpen=false;
let choiceReason="card";
let choiceOptions=[];


/* =========================
   SKILLS
========================= */

const skillData={
fireball:{level:1,damage:30,cooldown:1000,type:"projectile",color:"#ff5a1f",speed:8,icon:"🔥",name:"Fireball",desc:"Shoots a blazing fireball.",evolve:"Damage +25%"},
water:{level:2,damage:35,cooldown:1200,type:"projectile",color:"#38bdf8",speed:9,icon:"💧",name:"Water Bolt",desc:"Fires a fast water bolt.",evolve:"Speed +20%"},
ice:{level:3,damage:40,cooldown:1300,type:"projectile",color:"#bae6fd",speed:8,icon:"❄️",name:"Ice Shard",desc:"Freezes the target briefly.",evolve:"Longer freeze"},
flame:{level:3,damage:55,cooldown:2500,type:"area",color:"#ff6b00",radius:140,icon:"🌋",name:"Flame Wave",desc:"Burning wave damages nearby monsters.",evolve:"Area +20%"},
thunder:{level:5,damage:65,cooldown:1800,type:"thunder",color:"#fde047",icon:"⚡",name:"Thunder",desc:"Calls lightning on a nearby monster.",evolve:"Damage +25%"},
tsunami:{level:5,damage:75,cooldown:3000,type:"area",color:"#22d3ee",radius:170,icon:"🌊",name:"Tsunami",desc:"A huge wave hits nearby enemies.",evolve:"Radius +20%"},
blizzard:{level:7,damage:90,cooldown:4500,type:"area",color:"#dbeafe",radius:200,icon:"🌨️",name:"Blizzard",desc:"Freezes and damages a wide area.",evolve:"Freeze field +20%"},
bat:{level:1,damage:22,cooldown:1400,type:"projectile",color:"#a855f7",speed:10,icon:"🦇",name:"Bat Arrow",desc:"Summons a homing bat.",evolve:"Extra bat"},
frostField:{level:1,damage:20,cooldown:2600,type:"area",color:"#67e8f9",radius:120,icon:"🧊",name:"Frost Field",desc:"Creates a slowing frost field.",evolve:"Field radius +25%"},
boomFrog:{level:2,damage:48,cooldown:2200,type:"area",color:"#facc15",radius:105,icon:"🐸",name:"Boom Frog",desc:"Launches a bouncing frog bomb.",evolve:"Explosion +30%"},
familiar:{level:2,damage:28,cooldown:1500,type:"projectile",color:"#c084fc",speed:7,icon:"🐲",name:"Familiar",desc:"Fires a bouncing spirit.",evolve:"Spirit +25%"},
bulldak:{level:3,damage:60,cooldown:2800,type:"area",color:"#fb923c",radius:135,icon:"🐦",name:"Buldak",desc:"Summons a ring of attacking birds.",evolve:"More birds"},
crit:{level:1,type:"passive",icon:"💥",name:"Crit Rate",desc:"Crit Rate +10%.",evolve:"Crit Rate +10%"},
power:{level:2,type:"passive",icon:"⚔️",name:"Power",desc:"Attack +12%.",evolve:"Attack +12%"},
vitality:{level:2,type:"passive",icon:"❤️",name:"Vitality",desc:"Max HP +20.",evolve:"Max HP +25"},
haste:{level:3,type:"passive",icon:"⏱️",name:"Haste",desc:"Skill cooldown -8%.",evolve:"Cooldown -6%"},
regen:{level:4,type:"passive",icon:"💚",name:"Recovery",desc:"Regenerate 1 HP every 2 sec.",evolve:"Regeneration +1 HP"}
};


/* =========================
   JOYSTICK
========================= */

let joy={

    active:false,

    startX:0,
    startY:0,

    x:0,
    y:0,

    radius:60
};


canvas.addEventListener(
"pointerdown",
e=>{

    joy.active=true;

    joy.startX=e.clientX;
    joy.startY=e.clientY;

    joy.x=0;
    joy.y=0;

});


canvas.addEventListener(
"pointermove",
e=>{

    if(!joy.active)
        return;

    let dx=
    e.clientX-joy.startX;

    let dy=
    e.clientY-joy.startY;

    let d=
    Math.hypot(dx,dy);

    if(d>joy.radius){

        dx=
        dx/d*
        joy.radius;

        dy=
        dy/d*
        joy.radius;
    }

    joy.x=
    dx/joy.radius;

    joy.y=
    dy/joy.radius;

});


function stopJoy(){

    joy.active=false;

    joy.x=0;
    joy.y=0;
}


canvas.addEventListener(
"pointerup",
stopJoy
);

canvas.addEventListener(
"pointercancel",
stopJoy
);


/* =========================
   PLAYER MOVEMENT
========================= */

function movePlayer(){

    if(player.dead || choiceOpen) return;

    let dx=joy.x;
    let dy=joy.y;

    let len=
    Math.hypot(dx,dy);

    if(len>0){

        dx/=len;
        dy/=len;

        player.x+=
        dx*player.speed;

        player.y+=
        dy*player.speed;

        player.facingX=dx;
        player.facingY=dy;
    }

    player.x=
    Math.max(
        30,
        Math.min(
            W-30,
            player.x
        )
    );

    player.y=
    Math.max(
        120,
        Math.min(
            H-40,
            player.y
        )
    );
}


/* =========================
   MONSTERS
========================= */

function createMonster(){

    let types=[

        {
            color:"#22c55e",
            hp:50,
            speed:.8,
            radius:22
        },

        {
            color:"#ef4444",
            hp:70,
            speed:.65,
            radius:24
        },

        {
            color:"#9333ea",
            hp:100,
            speed:.5,
            radius:27
        }

    ];

    let t=
    types[
        Math.floor(
            Math.random()*
            types.length
        )
    ];

    let x,y;

    do{

        x=
        40+
        Math.random()*
        (W-80);

        y=
        130+
        Math.random()*
        Math.max(
            100,
            H-170
        );

    }while(
        Math.hypot(
            x-player.x,
            y-player.y
        )<200
    );

    let hp=
    t.hp+
    (stage-1)*15;

    monsters.push({

        x:x,
        y:y,

        radius:t.radius,

        color:t.color,

        type:
        t.color==="#22c55e" ? "goblin" :
        t.color==="#ef4444" ? "brute" : "mage",

        hp:hp,

        maxHp:hp,

        speed:
        t.speed+
        stage*.02,

        frozen:0,

        flash:0,

        lastAttack:0
    });
}


function maintainMonsters(){

    if(player.dead || choiceOpen) return;

    let wanted=
    Math.min(
        4+stage,
        9
    );

    while(
        monsters.length<
        wanted
    ){

        createMonster();
    }
}


/* =========================
   MONSTER MOVEMENT
========================= */

function moveMonsters(){

    if(player.dead || choiceOpen) return;

    for(const m of monsters){

        if(m.flash>0) m.flash--;

        if(m.frozen>0){
            m.frozen--;
            continue;
        }

        let dx=player.x-m.x;
        let dy=player.y-m.y;
        let d=Math.hypot(dx,dy);

        if(d>60){
            if(d>0){
                m.x+=dx/d*m.speed;
                m.y+=dy/d*m.speed;
            }
        }else{
            let now=performance.now();
            if(now-m.lastAttack>=900){
                m.lastAttack=now;
                damagePlayer(8,m);
            }
        }
    }
}


/* =========================
   PLAYER DAMAGE
========================= */

function damagePlayer(damage,monster){

    if(player.dead) return;

    player.hp-=damage;
    if(player.hp<0) player.hp=0;

    createParticles(player.x,player.y,"#ef4444",10);
    damageText(player.x,player.y-45,damage,"#ff5555");

    if(monster){
        let dx=player.x-monster.x;
        let dy=player.y-monster.y;
        let d=Math.hypot(dx,dy);
        if(d>0){
            player.x+=dx/d*5;
            player.y+=dy/d*5;
        }
    }

    if(player.hp<=0){
        player.dead=true;
        showGameOver();
    }
}

function showGameOver(){
    const box=document.getElementById("message");
    box.innerHTML='💀 GAME OVER<br><br><button onclick="restartGame()" style="padding:12px 25px;border:0;border-radius:10px;font-weight:bold;cursor:pointer">RESTART</button>';
    box.style.opacity=1;
    box.style.pointerEvents="auto";
}

function restartGame(){
player.x=W/2;player.y=H/2;player.hp=100;player.maxHp=100;player.dead=false;player.level=1;player.xp=0;player.coins=0;player.attack=15;player.lastAttack=0;player.lastDamage=0;player.facingX=1;player.facingY=0;
stage=1;kills=0;selectedSkill=null;skillCooldowns={};ownedSkills={};passiveStats={crit:0,attack:0,maxHp:0,regen:0,haste:0};xpGems=[];choiceOpen=false;
pickupCard={active:true,x:W/2,y:H/2-115,pulse:0};
monsters=[];projectiles=[];effects=[];particles=[];texts=[];
document.getElementById("skillPanel").style.display="none";document.getElementById("choiceOverlay").style.display="none";document.getElementById("bookOverlay").style.display="none";
const box=document.getElementById("message");box.innerHTML="";box.style.opacity=0;box.style.pointerEvents="none";
for(let i=0;i<5;i++)createMonster();updateSkillUI();updateHUD();requestAnimationFrame(gameLoop);
}


/* =========================
   NORMAL ATTACK
========================= */

function autoAttack(){

    if(player.dead || choiceOpen) return;

    let now=
    performance.now();

    if(
        now-player.lastAttack<
        650
    )
        return;

    let target=null;

    let closest=99999;

    for(
        const m of monsters
    ){

        let d=
        Math.hypot(
            m.x-player.x,
            m.y-player.y
        );

        if(
            d<85 &&
            d<closest
        ){

            closest=d;
            target=m;
        }
    }

    if(!target)
        return;

    player.lastAttack=now;

    hitMonster(
        target,
        player.attack,
        "#ffffff"
    );
}


/* =========================
   DAMAGE MONSTER
========================= */

function hitMonster(monster,damage,color){
let finalDamage=damage;
if(Math.random()<Math.min(.75,(passiveStats.crit||0)/100)){
finalDamage=Math.round(finalDamage*2);
damageText(monster.x,monster.y-50,"CRIT! "+finalDamage,"#facc15");
}
monster.hp-=finalDamage; monster.flash=8;
createParticles(monster.x,monster.y,color,8);
damageText(monster.x,monster.y-30,finalDamage,color);
if(monster.hp<=0){
let index=monsters.indexOf(monster); if(index!==-1) monsters.splice(index,1);
player.coins+=5; kills++;
for(let i=0;i<2+Math.floor(Math.random()*3);i++) xpGems.push({x:monster.x+(Math.random()-.5)*55,y:monster.y+(Math.random()-.5)*55,value:10,life:900,spin:Math.random()*6.28});
createParticles(monster.x,monster.y,"#84cc16",12);
if(kills>=5+stage*2){kills=0;stage++;showMessage("🏆 STAGE "+stage);}
levelCheck();
}
}


/* =========================
   LEVEL
========================= */

function levelCheck(){
let required=player.level*100;
while(player.xp>=required){
player.xp-=required; player.level++;
player.attack+=5; player.maxHp+=15; player.hp=player.maxHp;
showMessage("⭐ LEVEL "+player.level+"!");
if(player.level>=2) openSkillChoice("level");
required=player.level*100;
}
updateSkillUI();
}


/* =========================
   SKILL SELECTION
========================= */

function getSkillName(name){return skillData[name]?.name||name;}
function getSkillRank(name){return ownedSkills[name]||0;}
function skillRankText(rank){return "●".repeat(Math.min(rank,3))+"○".repeat(Math.max(0,3-Math.min(rank,3)));}

function applyPassive(name){
let r=ownedSkills[name]||1;
if(name==="crit") passiveStats.crit=10*r;
if(name==="power") passiveStats.attack=12*r;
if(name==="vitality") passiveStats.maxHp=20+25*(r-1);
if(name==="haste") passiveStats.haste=8+6*(r-1);
if(name==="regen") passiveStats.regen=r;
player.attack=Math.round((15+(player.level-1)*5)*(1+passiveStats.attack/100));
player.maxHp=100+(player.level-1)*15+passiveStats.maxHp;
if(player.hp>player.maxHp) player.hp=player.maxHp;
}

function chooseSkill(name){
if(!choiceOpen||!skillData[name]) return;
const s=skillData[name], old=ownedSkills[name]||0;
ownedSkills[name]=Math.min(3,old+1);
if(s.type==="passive") applyPassive(name);
else{
if(old>0){s.damage=Math.round(s.damage*1.2);if(s.radius)s.radius=Math.round(s.radius*1.15);if(s.speed)s.speed*=1.08;}
selectedSkill=name;
}
choiceOpen=false;
document.getElementById("choiceOverlay").style.display="none";
document.getElementById("choiceOverlay").setAttribute("aria-hidden","true");
document.getElementById("activeSkillBadge").textContent=s.type==="passive"?"💠 PASSIVE: "+s.name+" Lv."+ownedSkills[name]:"⚡ ACTIVE: "+s.name+" Lv."+ownedSkills[name];
showMessage((old?"⬆️ Evolved ":"✨ Equipped ")+s.name+" Lv."+ownedSkills[name]);
updateSkillUI(); updateHUD();
}

function randomChoicePool(){
const available=Object.keys(skillData).filter(n=>player.level>=skillData[n].level&&(ownedSkills[n]||0)<3);
let active=available.filter(n=>skillData[n].type!=="passive"), passive=available.filter(n=>skillData[n].type==="passive");
let pool=[];
if(active.length) pool.push(active[Math.floor(Math.random()*active.length)]);
if(passive.length) pool.push(passive[Math.floor(Math.random()*passive.length)]);
while(pool.length<3&&available.length){let n=available[Math.floor(Math.random()*available.length)];if(!pool.includes(n))pool.push(n);if(pool.length>=available.length)break;}
while(pool.length<3)pool.push(available[Math.floor(Math.random()*available.length)]||"fireball");
return pool;
}

function renderSkillChoices(){
const wrap=document.getElementById("choiceCards"); wrap.innerHTML="";
choiceOptions.forEach(name=>{
const s=skillData[name], rank=ownedSkills[name]||0, card=document.createElement("button");
card.type="button"; card.className="skillCard "+(s.type==="passive"?"passive":"");
card.innerHTML='<div class="cardRibbon">'+(rank?"EVOLVE":(s.type==="passive"?"PASSIVE":"ACTIVE"))+'</div><div class="cardName">'+s.name+'</div><div class="cardIcon">'+s.icon+'</div><div class="cardRankDots">'+skillRankText(Math.max(1,rank))+'</div><div class="cardBody"><div class="cardDesc">'+s.desc+'</div><div class="cardMeta">'+(rank?"Current Lv. "+rank:"New Skill")+'</div><div class="cardEvolution">✦ '+s.evolve+'</div></div>';
card.onclick=()=>chooseSkill(name); wrap.appendChild(card);
});
}

function openSkillChoice(reason){
if(player.dead)return;
choiceReason=reason; choiceOptions=randomChoicePool(); renderSkillChoices();
document.getElementById("choiceSub").textContent=reason==="card"?"GOLDEN CARD • NEW SKILL":"LEVEL UP • CHOOSE 1";

}

function selectSkill(name){

/* =========================
   USE SKILL
========================= */

function findNearest(){
    let target=null;
    let closest=Infinity;
    for(const m of monsters){
        const d=Math.hypot(m.x-player.x,m.y-player.y);
        if(d<closest){ closest=d; target=m; }
    }
    return target;
}

function castProjectile(s){
    const target=findNearest();
    if(!target) return false;
    projectiles.push({
        x:player.x, y:player.y,
        target:target,
        damage:s.damage,
        color:s.color,
        speed:s.speed,
        type:selectedSkill,
        life:120
    });
    return true;
}

function useSkill(){
if(!selectedSkill||player.dead||choiceOpen)return false;
const s=skillData[selectedSkill]; if(!s||s.type==="passive")return false;
let now=performance.now(), haste=passiveStats.haste||0;
let cd=s.cooldown*(1-haste/100), last=skillCooldowns[selectedSkill]||0;
if(now-last<cd||monsters.length===0)return false;
if((s.type==="projectile"||s.type==="thunder")&&!findNearest())return false;
skillCooldowns[selectedSkill]=now;
if(s.type==="projectile")castProjectile(s);else if(s.type==="area")castArea(s);else if(s.type==="thunder")castThunder(s);
return true;
}

function automaticSkill(){
    if(!selectedSkill || player.dead) return;
    useSkill();
}


/* =========================
   PROJECTILE UPDATE
========================= */

function updateProjectiles(){

    for(
        let i=
        projectiles.length-1;
        i>=0;
        i--
    ){

        let p=
        projectiles[i];

        if(
            !monsters.includes(
                p.target
            )
        ){

            projectiles.splice(i,1);

            continue;
        }

        let dx=
        p.target.x-p.x;

        let dy=
        p.target.y-p.y;

        let d=
        Math.hypot(dx,dy);

        createParticles(
            p.x,
            p.y,
            p.color,
            1
        );

        if(d<15){

            hitMonster(
                p.target,
                p.damage,
                p.color
            );

            if(
                p.type==="ice"
            ){

                p.target.frozen=
                100;
            }

            effects.push({

                type:"impact",

                x:p.target.x,
                y:p.target.y,

                radius:10,

                max:45,

                color:p.color,

                life:20
            });

            projectiles.splice(i,1);

            continue;
        }

        p.x+=
        dx/d*
        p.speed;

        p.y+=
        dy/d*
        p.speed;

        p.life--;

        if(p.life<=0)
            projectiles.splice(i,1);
    }
}


/* =========================
   AREA SKILLS
========================= */

function castArea(s){

    effects.push({

        type:selectedSkill,

        x:player.x,
        y:player.y,

        radius:10,

        max:s.radius,

        color:s.color,

        life:45
    });

    for(
        const m of [...monsters]
    ){

        let d=
        Math.hypot(
            m.x-player.x,
            m.y-player.y
        );

        if(
            d<=s.radius
        ){

            hitMonster(
                m,
                s.damage,
                s.color
            );

            if(
                selectedSkill===
                "blizzard"
            ){

                m.frozen=150;
            }
        }
    }
}


/* =========================
   THUNDER
========================= */

function castThunder(s){

    let target=
    findNearest();

    if(!target){

        showMessage(
            "No monster!"
        );

        return;
    }

    hitMonster(
        target,
        s.damage,
        s.color
    );

    effects.push({

        type:"thunder",

        x:target.x,
        y:target.y,

        color:s.color,

        life:25
    });
}


/* =========================
   PARTICLES
========================= */

function createParticles(
    x,y,color,count
){

    for(
        let i=0;
        i<count;
        i++
    ){

        let a=
        Math.random()*
        Math.PI*2;

        let speed=
        1+
        Math.random()*4;

        particles.push({

            x:x,
            y:y,

            vx:
            Math.cos(a)*
            speed,

            vy:
            Math.sin(a)*
            speed,

            life:
            15+
            Math.random()*25,

            color:color
        });
    }
}

function updateParticles(){

    for(
        let i=
        particles.length-1;
        i>=0;
        i--
    ){

        let p=
        particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.96;
        p.vy*=.96;

        p.life--;

        if(p.life<=0)
            particles.splice(i,1);
    }
}


/* =========================
   EFFECT UPDATE
========================= */

function updateEffects(){

    for(
        let i=
        effects.length-1;
        i>=0;
        i--
    ){

        let e=
        effects[i];

        e.life--;

        if(
            e.max
        ){

            e.radius+=
            (
                e.max-
                e.radius
            )*.2;
        }

        if(e.life<=0)
            effects.splice(i,1);
    }
}


/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground(){

    ctx.fillStyle=
    "#23432c";

    ctx.fillRect(
        0,0,W,H
    );

    for(
        let i=0;
        i<100;
        i++
    ){

        let x=
        (i*91)%W;

        let y=
        110+
        (i*47)%
        Math.max(
            100,
            H-130
        );

        ctx.fillStyle=
        i%2?
        "#2b5133":
        "#315b38";

        ctx.beginPath();

        ctx.arc(
            x,y,
            15+(i%5)*3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    drawTree(
        50,
        150
    );

    drawTree(
        W-50,
        180
    );

    drawTree(
        60,
        H-100
    );

    drawTree(
        W-60,
        H-130
    );
}


function drawTree(x,y){

    ctx.fillStyle=
    "#654321";

    ctx.fillRect(
        x-6,
        y,
        12,
        35
    );

    ctx.fillStyle=
    "#14532d";

    ctx.beginPath();

    ctx.arc(
        x,
        y-10,
        30,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle=
    "#166534";

    ctx.beginPath();

    ctx.arc(
        x-20,
        y,
        22,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+20,
        y,
        22,
        0,
        Math.PI*2
    );

    ctx.fill();
}

    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(0,r*.15,r*.28,0.15,Math.PI-0.15);
    ctx.stroke();

    /* weapon/claws */
    ctx.strokeStyle=type==="brute"?"#d1d5db":"#d1fae5";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(-r*.7,r*.35);
    ctx.lineTo(-r*1.05,r*.75);
    ctx.moveTo(r*.7,r*.35);
    ctx.lineTo(r*1.05,r*.75);
    ctx.stroke();

    /* hit flash */
    if(m.flash>0){
        ctx.fillStyle="rgba(255,255,255,.7)";
        ctx.beginPath();
        ctx.arc(0,0,r*1.05,0,Math.PI*2);
        ctx.fill();
    }

    /* HP bar */
    const bw=r*2.5;
    ctx.fillStyle="rgba(0,0,0,.75)";
    ctx.fillRect(-bw/2,-r-17,bw,7);
    ctx.fillStyle=m.hp/m.maxHp>.5?"#22c55e":m.hp/m.maxHp>.25?"#f59e0b":"#ef4444";
    ctx.fillRect(-bw/2,-r-17,bw*Math.max(0,m.hp/m.maxHp),7);
    ctx.strokeStyle="rgba(255,255,255,.25)";
    ctx.lineWidth=1;
    ctx.strokeRect(-bw/2,-r-17,bw,7);

    /* frozen ring */
    if(m.frozen>0){
        ctx.strokeStyle="#bae6fd";
        ctx.lineWidth=4;
        ctx.shadowBlur=12;
        ctx.shadowColor="#38bdf8";
        ctx.beginPath();
        ctx.arc(0,0,r+9,0,Math.PI*2);
        ctx.stroke();
        ctx.shadowBlur=0;
    }

    ctx.restore();
}


/* =========================
   DRAW PROJECTILES
========================= */

function drawProjectiles(){

    for(
        const p of projectiles
    ){

        ctx.save();

        ctx.shadowBlur=25;

        ctx.shadowColor=
        p.color;

        if(
            p.type===
            "fireball"
        ){

            ctx.fillStyle=
            "#ff3300";

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                12,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle=
            "#ffd166";

            ctx.beginPath();

            ctx.arc(
                p.x-3,
                p.y-3,
                6,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        else if(
            p.type===
            "water"
        ){

            ctx.fillStyle=
            "#38bdf8";

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                10,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.strokeStyle=
            "#bae6fd";

            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                15,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }

        else{

            /*
               ICE
            */

            ctx.fillStyle=
            "#bae6fd";

            ctx.beginPath();

            ctx.moveTo(
                p.x,
                p.y-14
            );

            ctx.lineTo(
                p.x+9,
                p.y
            );

            ctx.lineTo(
                p.x,
                p.y+14
            );

            ctx.lineTo(
                p.x-9,
                p.y
            );

            ctx.closePath();

            ctx.fill();
        }

        ctx.restore();
    }
}


/* =========================
   DRAW EFFECTS
========================= */

function drawEffects(){

    for(
        const e of effects
    ){

        let alpha=
        Math.max(
            0,
            e.life/45
        );

        ctx.save();

        ctx.globalAlpha=
        alpha;

        /*
           FIRE / WATER /
           BLIZZARD AREA
        */

        if(
            e.type===
            "flame"||
            e.type===
            "tsunami"||
            e.type===
            "blizzard"
        ){

            ctx.strokeStyle=
            e.color;

            ctx.lineWidth=
            e.type==="flame"?
            18:
            14;

            ctx.shadowBlur=25;

            ctx.shadowColor=
            e.color;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius,
                0,
                Math.PI*2
            );

            ctx.stroke();

            if(
                e.type==="blizzard"
            ){

                for(
                    let i=0;
                    i<15;
                    i++
                ){

                    let a=
                    i*.45;

                    let x=
                    e.x+
                    Math.cos(a)*
                    e.radius*.7;

                    let y=
                    e.y+
                    Math.sin(a)*
                    e.radius*.7;

                    ctx.fillStyle=
                    "#ffffff";

                    ctx.beginPath();

                    ctx.arc(
                        x,y,
                        4,
                        0,
                        Math.PI*2
                    );

                    ctx.fill();
                }
            }
        }

        /*
           THUNDER
        */

        if(
            e.type===
            "thunder"
        ){

            ctx.strokeStyle=
            "#fde047";

            ctx.lineWidth=7;

            ctx.shadowBlur=30;

            ctx.shadowColor=
            "#fde047";

            ctx.beginPath();

            ctx.moveTo(
                e.x,
                0
            );

            ctx.lineTo(
                e.x-15,
                e.y*.35
            );

            ctx.lineTo(
                e.x+15,
                e.y*.55
            );

            ctx.lineTo(
                e.x-8,
                e.y*.75
            );

            ctx.lineTo(
                e.x,
                e.y
            );

            ctx.stroke();
        }

        ctx.restore();
    }
}


/* =========================
   PARTICLES DRAW
========================= */

function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha=
        Math.max(
            0,
            p.life/40
        );

        ctx.fillStyle=
        p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
}


/* =========================
   JOYSTICK DRAW
========================= */

function drawJoystick(){

    if(!joy.active)
        return;

    ctx.globalAlpha=.8;

    ctx.fillStyle=
    "rgba(255,255,255,.15)";

    ctx.beginPath();

    ctx.arc(
        joy.startX,
        joy.startY,
        joy.radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle=
    "rgba(255,255,255,.4)";

    ctx.beginPath();

    ctx.arc(
        joy.startX+
        joy.x*joy.radius,

        joy.startY+
        joy.y*joy.radius,

        25,

        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;
}


/* =========================
   DAMAGE TEXT
========================= */

function damageText(
    x,y,text,color
){

    texts.push({

        x:x,
        y:y,

        text:"-"+text,

        color:color,

        life:35
    });
}


function updateTexts(){

    for(
        let i=texts.length-1;
        i>=0;
        i--
    ){

        let t=texts[i];

        t.y-=.6;

        t.life--;

        if(t.life<=0)
            texts.splice(i,1);
    }
}


function drawTexts(){

    for(
        const t of texts
    ){

        ctx.globalAlpha=
        t.life/35;

        ctx.fillStyle=
        t.color;

        ctx.font=
        "bold 17px Arial";

        ctx.textAlign=
        "center";

        ctx.fillText(
            t.text,
            t.x,
            t.y
        );
    }

    ctx.globalAlpha=1;
}


/* =========================
   HUD
========================= */

function updateHUD(){
document.getElementById("level").textContent=player.level;
document.getElementById("coins").textContent=player.coins;
document.getElementById("stage").textContent=stage;
document.getElementById("hpBar").style.width=Math.max(0,Math.min(100,player.hp/player.maxHp*100))+"%";
document.getElementById("xpBar").style.width=Math.max(0,Math.min(100,player.xp/(player.level*100)*100))+"%";
}


/* =========================
   SKILL UI
========================= */

function updateSkillUI(){
const list=document.getElementById("ownedSkillsList");
if(list){
list.innerHTML="";
const names=Object.keys(ownedSkills);
if(!names.length)list.innerHTML='<div class="ownedRow"><div class="ownedInfo"><div class="ownedName">No skills yet</div><div class="ownedDesc">Collect the golden skill card to begin.</div></div></div>';
else names.forEach(name=>{const s=skillData[name],row=document.createElement("div");row.className="ownedRow";row.innerHTML='<div class="ownedIcon">'+s.icon+'</div><div class="ownedInfo"><div class="ownedName">'+s.name+'</div><div class="ownedDesc">'+s.desc+'</div></div><div class="ownedRank">Lv.'+ownedSkills[name]+'</div>';list.appendChild(row);});
}
}


/* =========================
   MESSAGE
========================= */

let messageTimer;

function showMessage(text){

    let box=
    document.getElementById(
        "message"
    );

    box.textContent=text;

    box.style.opacity=1;
    box.style.pointerEvents="none";

    clearTimeout(
        messageTimer
    );

    messageTimer=
    setTimeout(
        ()=>{
            box.style.opacity=0;
        },
        1200
    );
}


/* =========================
   BUTTON EVENTS
========================= */
document.getElementById("skillButton").onclick=()=>{renderBook();document.getElementById("bookOverlay").style.display="block";};
document.getElementById("closeSkill").onclick=()=>document.getElementById("skillPanel").style.display="none";
document.getElementById("closeBook").onclick=()=>document.getElementById("bookOverlay").style.display="none";

function renderBook(){
const list=document.getElementById("bookList");list.innerHTML="";
[["🦇","⚔️","❤️"],["❄️","➕","💚"],["🔥","⏱️","💧"],["💥","⚔️","⭐"],["❤️","➕","⚔️"],["⚡","⏱️","🌩️"]].forEach(r=>{let d=document.createElement("div");d.className="recipe";d.innerHTML="<span>"+r[0]+"</span> ＋ <span>"+r[1]+"</span> ＝ <span>"+r[2]+"</span>";list.appendChild(d);});

document.getElementById("choiceOverlay").addEventListener("click",e=>{if(e.target.classList.contains("choiceShade"))showMessage("Choose one skill!");});

/* =========================
   GAME LOOP
========================= */

function gameLoop(){
if(player.dead){
drawBackground();drawXpGems();drawEffects();drawProjectiles();drawParticles();for(const m of monsters)drawMonster(m);drawPickupCard();drawPlayer();drawTexts();updateHUD();return;
}
movePlayer();
if(!choiceOpen){
moveMonsters();autoAttack();automaticSkill();updateProjectiles();updateParticles();updateEffects();updateTexts();updateXpGems();maintainMonsters();checkSkillPickup();
}else{updateParticles();updateEffects();updateTexts();}
drawBackground();drawXpGems();drawEffects();drawProjectiles();drawParticles();for(const m of monsters)drawMonster(m);drawPickupCard();drawPlayer();drawTexts();drawJoystick();updateHUD();requestAnimationFrame(gameLoop);
}

/* =========================
   START
========================= */

resize();
pickupCard={active:true,x:W/2,y:H/2-115,pulse:0};
for(let i=0;i<5;i++)createMonster();
updateSkillUI();updateHUD();gameLoop();

</script>
