<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Element RPG</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

<canvas id="game"></canvas>


<!-- HUD -->

<div id="hud">

    <div class="top-row">

        <div>⭐ Lv <span id="level">1</span></div>

        <div>🪙 <span id="coins">0</span></div>

        <div>🏆 Stage <span id="stage">1</span></div>

    </div>


    <div class="label">❤️ HP</div>

    <div class="bar">
        <div id="hpBar"></div>
    </div>


    <div class="label">✨ XP</div>

    <div class="bar">
        <div id="xpBar"></div>
    </div>

</div>


<!-- SKILLS BUTTON -->

<button id="skillsButton">
    ⚡ SKILLS
</button>


<!-- SELECTED SKILL -->

<button id="useSkillButton">
    ⚡ SELECT SKILL
</button>


<!-- SKILL PANEL -->

<div id="skillPanel">

    <div class="skillHeader">

        <b>⚡ ELEMENTAL SKILLS</b>

        <button id="closeSkills">
            ✕
        </button>

    </div>


    <!-- FIRE -->

    <div class="element fire">
        🔥 FIRE
    </div>

    <button class="skill"
    onclick="selectSkill('fireball')">

        🔥 Fireball

        <span>
            DMG 25
        </span>

    </button>


    <button class="skill"
    onclick="selectSkill('flamewave')">

        🔥 Flame Wave

        <span>
            DMG 40
        </span>

    </button>


    <button class="skill locked"
    onclick="selectSkill('meteor')">

        ☄️ Meteor

        <span>
            LV 10
        </span>

    </button>


    <!-- WATER -->

    <div class="element water">
        💧 WATER
    </div>


    <button class="skill"
    onclick="selectSkill('waterbolt')">

        💧 Water Bolt

        <span>
            DMG 25
        </span>

    </button>


    <button class="skill"
    onclick="selectSkill('tsunami')">

        🌊 Tsunami

        <span>
            DMG 60
        </span>

    </button>


    <!-- ICE -->

    <div class="element ice">
        ❄️ ICE
    </div>


    <button class="skill"
    onclick="selectSkill('iceshard')">

        ❄️ Ice Shard

        <span>
            DMG 30
        </span>

    </button>


    <button class="skill"
    onclick="selectSkill('blizzard')">

        🌨️ Blizzard

        <span>
            DMG 70
        </span>

    </button>


    <!-- LIGHTNING -->

    <div class="element lightning">
        ⚡ LIGHTNING
    </div>


    <button class="skill"
    onclick="selectSkill('thunder')">

        ⚡ Thunder Bolt

        <span>
            DMG 35
        </span>

    </button>

</div>


<div id="message"></div>


<script src="game.js?v=4"></script>

</body>

</html>
