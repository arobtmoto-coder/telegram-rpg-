<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Element RPG</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud">

    <div class="top-row">
        <div>⭐ Lv <span id="level">1</span></div>
        <div>🪙 <span id="coins">0</span></div>
        <div>🏆 Stage <span id="stage">1</span></div>
    </div>

    <div class="bar-label">
        ❤️ HP
    </div>

    <div class="bar">
        <div id="hpBar" class="hp"></div>
    </div>

    <div class="bar-label">
        ✨ XP
    </div>

    <div class="bar">
        <div id="xpBar" class="xp"></div>
    </div>

</div>


<!-- Skills button -->
<button id="skillsButton">⚡ SKILLS</button>


<!-- Skill Panel -->
<div id="skillPanel">

    <div class="skill-header">
        <b>⚡ ELEMENTAL SKILLS</b>
        <button id="closeSkills">✕</button>
    </div>

    <div class="element-title fire-title">
        🔥 FIRE
    </div>

    <button class="skill" onclick="selectSkill('fireball')">
        🔥 Fireball
        <span>DMG 25</span>
    </button>

    <button class="skill" onclick="selectSkill('flamewave')">
        🔥 Flame Wave
        <span>DMG 40</span>
    </button>

    <button class="skill locked" onclick="selectSkill('meteor')">
        ☄️ Meteor
        <span>Lv 10</span>
    </button>


    <div class="element-title water-title">
        💧 WATER
    </div>

    <button class="skill" onclick="selectSkill('waterbolt')">
        💧 Water Bolt
        <span>DMG 25</span>
    </button>

    <button class="skill locked" onclick="selectSkill('tsunami')">
        🌊 Tsunami
        <span>Lv 10</span>
    </button>


    <div class="element-title ice-title">
        ❄️ ICE
    </div>

    <button class="skill" onclick="selectSkill('iceshard')">
        ❄️ Ice Shard
        <span>DMG 30</span>
    </button>

    <button class="skill locked" onclick="selectSkill('blizzard')">
        🌨️ Blizzard
        <span>Lv 15</span>
    </button>


    <div class="element-title lightning-title">
        ⚡ LIGHTNING
    </div>

    <button class="skill" onclick="selectSkill('thunder')">
        ⚡ Thunder Bolt
        <span>DMG 35</span>
    </button>

</div>


<div id="message"></div>


<script src="game.js?v=3"></script>

</body>
</html>
