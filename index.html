<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Element RPG - Telegram WebApp</title>

<!-- Telegram Web App SDK Integration -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#14232b;
}

#game{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    touch-action:none;
    outline:none;
}

/* ===== LOBBY / START SCREEN ===== */
#lobbyScreen {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #1e293b, #0f172a);
    z-index: 200;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    padding: 20px;
}

#lobbyScreen h1 {
    font-size: 38px;
    margin-bottom: 10px;
    color: #facc15;
    text-shadow: 0 4px 10px rgba(250, 204, 21, 0.4);
}

#lobbyScreen p {
    font-size: 16px;
    color: #94a3b8;
    margin-bottom: 30px;
}

.startBtn {
    padding: 16px 40px;
    font-size: 20px;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
    transition: transform 0.1s;
}

.startBtn:active {
    transform: scale(0.95);
}

/* ===== HUD OVERLAY ===== */
#hud{
    position:fixed;
    top:15px;
    left:15px;
    right:15px;
    background:rgba(10,15,20,.92);
    border-radius:18px;
    padding:15px;
    color:white;
    z-index:10;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
}

.top{
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.barTitle{
    font-size:12px;
    margin:4px 0 2px 0;
    color: #cbd5e1;
    display: flex;
    justify-content: space-between;
}

.bar{
    width:100%;
    height:14px;
    background:#30343a;
    border-radius:10px;
    overflow:hidden;
    border: 1px solid rgba(255,255,255,0.05);
}

#hpBar{
    height:100%;
    width:100%;
    background: linear-gradient(90deg, #ef4444, #f87171);
    transition: width 0.2s;
}

#xpBar{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, #eab308, #facc15);
    transition: width 0.2s;
}

#skillButton{
    position:fixed;
    right:20px;
    bottom:25px;
    border:0;
    border-radius:20px;
    padding:15px 25px;
    background:#7c3aed;
    color:white;
    font-size:16px;
    font-weight:bold;
    z-index:20;
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
    cursor: pointer;
}

#skillPanel{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:420px;
    max-height:80vh;
    overflow-y:auto;
    background:#111827;
    border:2px solid #475569;
    border-radius:22px;
    padding:20px;
    z-index:50;
    color:white;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
}

#skillPanel h2{
    margin-top:0;
    text-align:center;
}

.ownedRow {
    display: flex;
    align-items: center;
    background: #1e293b;
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 8px;
}
.ownedIcon { font-size: 24px; margin-right: 10px; }
.ownedInfo { flex: 1; }
.ownedName { font-weight: bold; font-size: 14px; }
.ownedDesc { font-size: 11px; color: #94a3b8; }
.ownedRank { font-size: 12px; font-weight: bold; color: #facc15; }

#closeSkill{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:0;
    border-radius:12px;
    background:#374151;
    color:white;
    font-weight:bold;
    cursor: pointer;
}

#message{
    position:fixed;
    left:50%;
    top:30%;
    transform:translateX(-50%);
    padding:12px 20px;
    background:rgba(0,0,0,.85);
    color:white;
    border-radius:15px;
    font-weight:bold;
    opacity:0;
    transition:.2s;
    z-index:100;
    pointer-events:none;
    text-align: center;
}

/* ===== CHOICE & BOOK OVERLAYS ===== */
#choiceOverlay,#bookOverlay{display:none;position:fixed;inset:0;z-index:120;}
.choiceShade,.bookShade{position:absolute;inset:0;background:rgba(0,0,0,.84);backdrop-filter:blur(2px)}
.choiceContent{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,98vw);max-height:96vh;overflow:auto;padding:8px 5px 14px;color:#fff;text-align:center;}
.choiceTitle{font-size:27px;font-weight:1000;text-shadow:0 3px #000;margin:0 0 12px}
.choiceSub{font-size:10px;font-weight:900;letter-spacing:1px;color:#facc15;margin-bottom:10px;}
#choiceCards{display:flex;gap:10px;justify-content:center;align-items:stretch}
.skillCard{position:relative;flex:1;min-width:0;min-height:380px;border-radius:18px;border:3px solid #ffd23e;background:linear-gradient(#ffd45a 0 23%,#efbb2f 23% 36%,#3b2418 36%);color:#fff;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.65);cursor:pointer;padding:0}
.skillCard.passive{border-color:#60c9ff;background:linear-gradient(#4fc4ed 0 23%,#239fc9 23% 36%,#102e5e 36%)}
.cardRibbon{position:absolute;top:-2px;left:50%;transform:translateX(-50%);min-width:102px;padding:5px 10px;border-radius:0 0 12px 12px;background:#ffd23e;color:#8b5600;font-weight:1000;font-size:11px;}
.passive .cardRibbon{background:#59cef5;color:#07517a;}
.cardName{margin-top:40px;padding:0 4px;font-size:15px;font-weight:1000;}
.cardIcon{height:90px;display:flex;align-items:center;justify-content:center;font-size:55px;}
.cardRankDots{font-size:11px;color:#76ff3d;}
.cardBody{padding:12px 8px;}
.cardDesc{font-size:12px;line-height:1.3;}
.cardMeta{margin-top:8px;font-size:10px;opacity:.8;}
.choiceFooter{margin-top:15px;}
.choiceButtons{display:flex;justify-content:center;gap:30px;margin-top:5px}
.choiceButtons button{border:0;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:1000;color:#fff;cursor:pointer;}
#refreshChoices{background:#43d83a}
#choiceBook{background:#454b64}

.bookContent{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);max-height:90vh;overflow:auto;text-align:center;color:#fff;background:#0f172a;padding:20px;border-radius:18px;border:1px solid #334155;}
.bookTitle{font-size:22px;font-weight:bold;margin-bottom:15px;}
.recipe{font-size:18px;padding:8px;border-bottom:1px solid rgba(255,255,255,.1)}
</style>
</head>

<body>

<!-- LOBBY SCREEN -->
<div id="lobbyScreen">
    <h1>ELEMENT RPG</h1>
    <p>Survival Action Adventure</p>
    <button class="startBtn" onclick="startGame()">START GAME</button>
</div>

<canvas id="game" tabindex="0"></canvas>

<!-- ORIGINAL HUD RESTORED -->
<div id="hud">
  <div class="top">
    <div>STAGE <span id="stage">1</span></div>
    <div>🪙 <span id="coins">0</span> | ☠️ <span id="kills">0</span></div>
  </div>
  
  <div class="barTitle"><span>HEALTH</span> <span id="hpText">100/100</span></div>
  <div class="bar"><div id="hpBar"></div></div>

  <div class="barTitle"><span>XP PROGRESS</span> <span id="levelText">LVL 1</span></div>
  <div class="bar"><div id="xpBar"></div></div>
</div>

<button id="skillButton">📖 SKILLS</button>

<div id="skillPanel">
<h2>⚡ SKILL BOOK</h2>
<div id="ownedSkillsList"></div>
<button id="closeSkill">CLOSE</button>
</div>

<div id="choiceOverlay">
  <div class="choiceShade"></div>
  <div class="choiceContent">
    <div class="choiceTitle">Choose your Skill !</div>
    <div class="choiceSub" id="choiceSub">LEVEL UP • CHOOSE 1</div>
    <div id="choiceCards"></div>
    <div class="choiceFooter">
      <div class="choiceButtons">
        <button id="refreshChoices">⟳ Refresh</button>
        <button id="choiceBook">📖 Book</button>
      </div>
      <div style="margin-top:8px;font-size:12px;">Free Uses: <span id="freeUses">2</span></div>
    </div>
  </div>
</div>

<div id="bookOverlay">
  <div class="bookShade"></div>
  <div class="bookContent">
    <div class="bookTitle">📖 SKILL EVOLUTION BOOK</div>
    <div id="bookList"></div>
    <button id="closeBook" style="margin-top:15px;padding:10px 20px;border-radius:8px;border:0;background:#334155;color:white;font-weight:bold;cursor:pointer;">Close</button>
  </div>
</div>

<div id="message"></div>

<script>
"use strict";

const tg = window.Telegram ? window.Telegram.WebApp : null;
if(tg){ tg.ready(); tg.expand(); }

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0, H = 0;
const WORLD_W = 2600;
const WORLD_H = 4200;

let camera = { x: 0, y: 0 };
let gameStarted = false;

function updateCamera(){
    camera.x = Math.max(0, Math.min(WORLD_W - W, player.x - W/2));
    camera.y = Math.max(0, Math.min(WORLD_H - H, player.y - H/2));
}

function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    if(player.x === 0){ player.x = WORLD_W / 2; player.y = WORLD_H / 2; }
    updateCamera();
}
window.addEventListener("resize", resize);

/* =========================
   PLAYER & GAME STATE
========================= */
const player = {
    x: 0, y: 0,
    speed: 4,
    hp: 100, maxHp: 100,
    dead: false,
    level: 1, xp: 0, coins: 0,
    attack: 15, lastAttack: 0,
    facingX: 1, facingY: 0
};

let stage = 1;
let kills = 0;
let freeUses = 2;
let monsters = [];
let projectiles = [];
let effects = [];
let particles = [];
let texts = [];
let xpGems = [];

let selectedSkill = null;
let skillCooldowns = {};
let ownedSkills = {};
let passiveStats = {crit:0, attack:0, maxHp:0, regen:0, haste:0};

let pickupCard = {active:true, x: WORLD_W/2, y: WORLD_H/2 - 115};
let choiceOpen = false;
let choiceOptions = [];

/* =========================
   SKILLS DATA
========================= */
const skillData = {
fireball:{level:1,damage:30,cooldown:1000,type:"projectile",color:"#ff5a1f",speed:8,icon:"🔥",name:"Fireball",desc:"Shoots a blazing fireball."},
water:{level:2,damage:35,cooldown:1200,type:"projectile",color:"#38bdf8",speed:9,icon:"💧",name:"Water Bolt",desc:"Fires a fast water bolt."},
ice:{level:3,damage:40,cooldown:1300,type:"projectile",color:"#bae6fd",speed:8,icon:"❄️",name:"Ice Shard",desc:"Freezes target briefly."},
flame:{level:3,damage:55,cooldown:2500,type:"area",color:"#ff6b00",radius:140,icon:"🌋",name:"Flame Wave",desc:"Burning wave hits nearby monsters."},
thunder:{level:5,damage:65,cooldown:1800,type:"thunder",color:"#fde047",icon:"⚡",name:"Thunder",desc:"Calls lightning on monster."},
crit:{level:1,type:"passive",icon:"💥",name:"Crit Rate",desc:"Crit Rate +10%."},
power:{level:2,type:"passive",icon:"⚔️",name:"Power",desc:"Attack +12%."},
vitality:{level:2,type:"passive",icon:"❤️",name:"Vitality",desc:"Max HP +20."},
regen:{level:4,type:"passive",icon:"💚",name:"Recovery",desc:"Regenerate HP over time."}
};

/* =========================
   CONTROLS
========================= */
let joy = { active: false, startX: 0, startY: 0, x: 0, y: 0, radius: 60 };
const keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

window.addEventListener("keydown", e => { if(keys.hasOwnProperty(e.code)) keys[e.code] = true; });
window.addEventListener("keyup", e => { if(keys.hasOwnProperty(e.code)) keys[e.code] = false; });

canvas.addEventListener("pointerdown", e => {
    joy.active = true; joy.startX = e.clientX; joy.startY = e.clientY; joy.x = 0; joy.y = 0;
});
canvas.addEventListener("pointermove", e => {
    if(!joy.active) return;
    let dx = e.clientX - joy.startX, dy = e.clientY - joy.startY, d = Math.hypot(dx, dy);
    if(d > joy.radius){ dx = dx / d * joy.radius; dy = dy / d * joy.radius; }
    joy.x = dx / joy.radius; joy.y = dy / joy.radius;
});
const stopJoy = () => { joy.active = false; joy.x = 0; joy.y = 0; };
canvas.addEventListener("pointerup", stopJoy);
canvas.addEventListener("pointercancel", stopJoy);

/* =========================
   GAME LOGIC & LOBBY
========================= */
function startGame(){
    document.getElementById("lobbyScreen").style.display = "none";
    gameStarted = true;
    resize();
    restartGame();
}

function movePlayer(){
    if(player.dead || choiceOpen || !gameStarted) return;
    let dx = joy.x, dy = joy.y;
    if (keys.KeyW || keys.ArrowUp) dy -= 1;
    if (keys.KeyS || keys.ArrowDown) dy += 1;
    if (keys.KeyA || keys.ArrowLeft) dx -= 1;
    if (keys.KeyD || keys.ArrowRight) dx += 1;

    let len = Math.hypot(dx, dy);
    if(len > 0){
        dx /= len; dy /= len;
        player.x += dx * player.speed;
        player.y += dy * player.speed;
        player.facingX = dx; player.facingY = dy;
    }
    player.x = Math.max(30, Math.min(WORLD_W - 30, player.x));
    player.y = Math.max(120, Math.min(WORLD_H - 40, player.y));
    updateCamera();
}

/* =========================
   MONSTERS (5 CATEGORIES)
========================= */
function createMonster(){
    let types = [
        { type: "goblin", hp:45, speed:0.85, radius:22 },
        { type: "wolf", hp:60, speed:1.05, radius:24 },
        { type: "hand", hp:85, speed:0.7, radius:25 },
        { type: "brute", hp:110, speed:0.55, radius:29 },
        { type: "mage", hp:75, speed:0.65, radius:24 }
    ];
    let t = types[Math.floor(Math.random()*types.length)];
    let x, y;
    do {
        x = 40 + Math.random() * (WORLD_W - 80);
        y = 130 + Math.random() * (WORLD_H - 170);
    } while(Math.hypot(x - player.x, y - player.y) < 250);

    let hp = t.hp + (stage - 1) * 15;
    monsters.push({
        x: x, y: y, radius: t.radius, type: t.type,
        hp: hp, maxHp: hp, speed: t.speed + stage*.02,
        frozen: 0, flash: 0, lastAttack: 0
    });
}

function maintainMonsters(){
    if(player.dead || choiceOpen || !gameStarted) return;
    let wanted = Math.min(4 + stage, 10);
    while(monsters.length < wanted) createMonster();
}

function moveMonsters(){
    if(player.dead || choiceOpen || !gameStarted) return;
    for(const m of monsters){
        if(m.flash > 0) m.flash--;
        if(m.frozen > 0){ m.frozen--; continue; }
        let dx = player.x - m.x, dy = player.y - m.y, d = Math.hypot(dx, dy);
        if(d > 45){
            m.x += dx/d * m.speed; m.y += dy/d * m.speed;
        } else {
            let now = performance.now();
            if(now - m.lastAttack >= 800){
                m.lastAttack = now;
                damagePlayer(8);
            }
        }
    }
}

function damagePlayer(damage){
    if(player.dead) return;
    player.hp -= damage;
    if(player.hp <= 0){
        player.hp = 0; player.dead = true;
        showGameOver();
    }
    updateHUD();
}

function showGameOver(){
    const box = document.getElementById("message");
    box.innerHTML = '💀 GAME OVER<br><br><button onclick="restartGame()" style="padding:10px 20px;border:0;border-radius:8px;font-weight:bold;cursor:pointer">RESTART</button>';
    box.style.opacity = 1; box.style.pointerEvents = "auto";
}

function restartGame(){
    player.x = WORLD_W/2; player.y = WORLD_H/2;
    player.hp = 100; player.maxHp = 100; player.dead = false;
    player.level = 1; player.xp = 0; player.coins = 0; player.attack = 15;
    stage = 1; kills = 0; freeUses = 2;
    selectedSkill = null; skillCooldowns = {}; ownedSkills = {};
    monsters = []; projectiles = []; effects = []; particles = []; xpGems = [];
    pickupCard = {active:true, x: WORLD_W/2, y: WORLD_H/2 - 115};
    choiceOpen = false;

    document.getElementById("message").style.opacity = 0;
    document.getElementById("message").style.pointerEvents = "none";
    document.getElementById("choiceOverlay").style.display = "none";

    for(let i=0; i<5; i++) createMonster();
    updateHUD();
}

/* =========================
   ATTACK & SKILLS
========================= */
function autoAttack(){
    if(player.dead || choiceOpen || !gameStarted) return;
    let now = performance.now();
    if(now - player.lastAttack < 600) return;

    let target = null, closest = 90;
    for(const m of monsters){
        let d = Math.hypot(m.x - player.x, m.y - player.y);
        if(d < closest){ closest = d; target = m; }
    }
    if(!target) return;
    player.lastAttack = now;
    hitMonster(target, player.attack, "#ffffff");
}

function hitMonster(monster, damage, color){
    monster.hp -= damage; monster.flash = 6;
    damageText(monster.x, monster.y - 20, damage, color);

    if(monster.hp <= 0){
        let index = monsters.indexOf(monster);
        if(index !== -1) monsters.splice(index, 1);
        player.coins += 5; kills++;
        xpGems.push({ x: monster.x, y: monster.y, value: 20 });
        if(kills >= 6 + stage*2){ kills = 0; stage++; showMessage("🏆 STAGE " + stage); }
        updateHUD();
    }
}

function updateXpGems(){
    for(let i = xpGems.length - 1; i >= 0; i--){
        let g = xpGems[i];
        let d = Math.hypot(g.x - player.x, g.y - player.y);
        if(d < 80){ g.x += (player.x - g.x) * .15; g.y += (player.y - g.y) * .15; }
        if(d < 20){
            player.xp += g.value;
            xpGems.splice(i, 1);
            levelCheck();
            continue;
        }
    }
}

function levelCheck(){
    let required = player.level * 80;
    if(player.xp >= required){
        player.xp -= required; player.level++;
        player.maxHp += 10; player.hp = player.maxHp;
        showMessage("⭐ LEVEL UP!");
        openSkillChoice();
    }
    updateHUD();
}

function openSkillChoice(){
    choiceOptions = Object.keys(skillData).slice(0, 3);
    renderSkillChoices();
    document.getElementById("choiceOverlay").style.display = "block";
    choiceOpen = true;
}

function renderSkillChoices(){
    const wrap = document.getElementById("choiceCards"); wrap.innerHTML = "";
    choiceOptions.forEach(name => {
        const s = skillData[name], card = document.createElement("div");
        card.className = "skillCard " + (s.type === "passive" ? "passive" : "");
        card.innerHTML = `<div class="cardRibbon">SKILL</div><div class="cardName">${s.name}</div><div class="cardIcon">${s.icon}</div><div class="cardBody"><div class="cardDesc">${s.desc}</div></div>`;
        card.onclick = () => {
            ownedSkills[name] = (ownedSkills[name]||0) + 1;
            selectedSkill = name;
            choiceOpen = false;
            document.getElementById("choiceOverlay").style.display = "none";
        };
        wrap.appendChild(card);
    });
}

/* =========================
   RENDERING
========================= */
function drawBackground(){
    ctx.fillStyle = "#22303c"; ctx.fillRect(0, 0, W, H);
}

function drawPlayer(){
    const dir = player.facingX >= 0 ? 1 : -1;
    ctx.save();
    ctx.translate(player.x - camera.x, player.y - camera.y);
    ctx.scale(dir, 1);

    // Cape
    ctx.fillStyle = "#6d28d9"; ctx.beginPath(); ctx.moveTo(-10, -5); ctx.lineTo(-20, 25); ctx.lineTo(10, 25); ctx.fill();
    // Body Armor
    ctx.fillStyle = "#475569"; ctx.fillRect(-10, -5, 20, 22);
    // Helmet
    ctx.fillStyle = "#94a3b8"; ctx.beginPath(); ctx.arc(0, -12, 11, 0, Math.PI*2); ctx.fill();
    // Visor Glow
    ctx.fillStyle = "#38bdf8"; ctx.fillRect(-4, -14, 8, 3);
    ctx.restore();
}

function drawMonster(m){
    ctx.save();
    ctx.translate(m.x - camera.x, m.y - camera.y);
    const r = m.radius;

    if(m.type === "goblin"){ ctx.fillStyle = "#22c55e"; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill(); }
    else if(m.type === "wolf"){ ctx.fillStyle = "#64748b"; ctx.beginPath(); ctx.ellipse(0, 0, r*1.1, r*.7, 0, 0, Math.PI*2); ctx.fill(); }
    else if(m.type === "hand"){ ctx.fillStyle = "#881337"; ctx.fillRect(-r*.6, -r*.6, r*1.2, r*1.2); }
    else if(m.type === "brute"){ ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill(); }
    else if(m.type === "mage"){ ctx.fillStyle = "#a855f7"; ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(-r, r); ctx.lineTo(r, r); ctx.fill(); }

    if(m.flash > 0){ ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
}

function updateHUD(){
    document.getElementById("stage").textContent = stage;
    document.getElementById("coins").textContent = player.coins;
    document.getElementById("kills").textContent = kills;
    document.getElementById("hpText").textContent = `${Math.max(0, player.hp)}/${player.maxHp}`;
    document.getElementById("hpBar").style.width = `${Math.max(0, (player.hp/player.maxHp)*100)}%`;
    document.getElementById("levelText").textContent = `LVL ${player.level}`;
    document.getElementById("xpBar").style.width = `${(player.xp / (player.level * 80))*100}%`;
}

function damageText(x, y, text, color){
    texts.push({ x: x, y: y, text: text, color: color, life: 30 });
}
function drawTexts(){
    for(let i = texts.length - 1; i >= 0; i--){
        let t = texts[i]; t.y -= 0.5; t.life--;
        ctx.fillStyle = t.color; ctx.font = "bold 14px Arial";
        ctx.fillText(t.text, t.x - camera.x, t.y - camera.y);
        if(t.life <= 0) texts.splice(i, 1);
    }
}

function showMessage(text){
    let box = document.getElementById("message");
    box.textContent = text; box.style.opacity = 1;
    setTimeout(() => { box.style.opacity = 0; }, 1200);
}

/* =========================
   MAIN LOOP
========================= */
function gameLoop(){
    if(gameStarted && !player.dead){
        movePlayer();
        if(!choiceOpen){
            moveMonsters(); autoAttack(); updateXpGems(); maintainMonsters();
        }
    }

    drawBackground();
    for(const g of xpGems){ ctx.fillStyle = "#facc15"; ctx.fillRect(g.x - camera.x, g.y - camera.y, 6, 6); }
    for(const m of monsters) drawMonster(m);
    if(gameStarted) drawPlayer();
    drawTexts();

    requestAnimationFrame(gameLoop);
}

document.getElementById("skillButton").onclick = () => {
    const panel = document.getElementById("skillPanel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
};
document.getElementById("closeSkill").onclick = () => { document.getElementById("skillPanel").style.display = "none"; };

resize();
gameLoop();

</script>
</body>
</html>
